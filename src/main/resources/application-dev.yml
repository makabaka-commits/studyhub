server:
  port: 8080

spring:
  datasource:
    url: ${STUDYHUB_DB_URL:jdbc:mysql://localhost:3306/studyhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${STUDYHUB_DB_USERNAME:root}
    password: ${STUDYHUB_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      pool-name: StudyHubPool
      connection-test-query: SELECT 1
  rabbitmq:
    connection-timeout: 3s
    host: ${STUDYHUB_RABBITMQ_HOST:localhost}
    port: ${STUDYHUB_RABBITMQ_PORT:5672}
    username: ${STUDYHUB_RABBITMQ_USERNAME:guest}
    password: ${STUDYHUB_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
  data:
    redis:
      host: ${STUDYHUB_REDIS_HOST:localhost}
      port: ${STUDYHUB_REDIS_PORT:6379}
      database: ${STUDYHUB_REDIS_DATABASE:0}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: info
    com.studyhub: info
    com.studyhub.mapper: debug
  file:
    name: logs/studyhub.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-api-key-here}
    base-url: https://api.deepseek.com
    model: deepseek-chat
