name: CI

# 触发条件：推送到任意分支 或 创建 Pull Request
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 启动 MySQL 和 Redis 供测试使用
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: studyhub_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Step 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: 编译和测试
      - name: Build and test with Maven
        run: mvn clean verify -B
        env:
          STUDYHUB_DB_URL: jdbc:mysql://localhost:3306/studyhub_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          STUDYHUB_DB_USERNAME: testuser
          STUDYHUB_DB_PASSWORD: testpass123
          STUDYHUB_REDIS_HOST: localhost
          STUDYHUB_REDIS_PORT: 6379

      # Step 4: 上传测试报告
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
